  <!-- CONTACT -->
  <section class="contact" id="contact">
    <div class="wrap contact-grid">
      <div class="contact-copy reveal">
        <p class="eyebrow">Επικοινωνία</p>
        <h2>Κλείστε το ραντεβού σας</h2>
        <p>Στείλτε μας λίγα λόγια για το τι σας απασχολεί και θα επικοινωνήσουμε μαζί σας το συντομότερο.</p>
      </div>

      <!--
        FORMSPREE SETUP (free tier, no backend needed):
        1. Create a free account at https://formspree.io
        2. Create a form, copy the endpoint (https://formspree.io/f/xxxxabcd)
        3. Replace YOUR_FORM_ID below with your real ID.
      -->
      <form class="contact-form reveal" id="contact-form" action="https://formspree.io/f/xljeranv" method="POST" novalidate>
        <div class="form-row">
          <label for="name">Ονοματεπώνυμο <span class="required">*</span></label>
          <input type="text" id="name" name="name" required autocomplete="name">
        </div>
        <div class="form-row form-row-split">
          <div>
            <label for="email">Email <span class="required">*</span></label>
            <input type="email" id="email" name="email" required autocomplete="email">
          </div>
          <div>
            <label for="phone">Τηλέφωνο (προαιρετικό)</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel">
          </div>
        </div>
        <div class="form-row">
          <label for="topic">Μήνυμα <span class="required">*</span></label>
          <textarea id="topic" name="topic" rows="4" required></textarea>
        </div>
        <div class="form-row form-row-check">
          <input type="checkbox" id="consent" name="consent" required>
          <label for="consent">Συναινώ στην επεξεργασία των στοιχείων μου αποκλειστικά για την οργάνωση του ραντεβού.  <span class="required">*</span></label>
        </div>
        <input type="hidden" name="_subject" value="Νέο μήνυμα από τη φόρμα επικοινωνίας">
        <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
        <button type="submit" class="btn btn-primary btn-block">Αποστολή μηνύματος</button>
        <p class="form-note" id="form-note" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>

   <!--
    MAP SETUP:
    Το παρακάτω "q=" είναι placeholder διεύθυνση. Αντικατέστησέ το
    με τη δική σου, π.χ. q=Ημιθέων+12,+Παγκράτι,+Αθήνα
    Ή, για ακριβέστερο αποτέλεσμα με σωστό pin: πήγαινε στο Google
    Maps, αναζήτησε τη διεύθυνσή σου, πάτα "Κοινοποίηση" →
    "Embed a map", και αντικατέστησε ολόκληρο το src με αυτό
    που σου δίνει το Google.
  -->
  <div class="map-embed">
    <iframe
      src="https://www.google.com/maps?q=Πλατεία Λακωνίας+48,+Πανόρμου,+Αθήνα&output=embed"
      width="100%" height="280" style="border:0"
      allowfullscreen loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      title="Χάρτης τοποθεσίας γραφείου"></iframe>
  </div>
